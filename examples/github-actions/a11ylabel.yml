# Copy to .github/workflows/a11ylabel.yml in an app repository. On every pull request that changes
# the app, the a11ylabel report is added to the job summary and kept as an artifact, and the job
# fails when the code blocks or may break one of the labels you claim on the App Store.
#
# Set LABELS to the labels you claim in App Store Connect (comma-separated ids: voiceover,
# voice-control, larger-text, dark-interface, differentiate-without-color, sufficient-contrast,
# reduced-motion, captions, audio-descriptions). Use `--fail-on error` to fail only when a label is
# blocked, or `--fail-on none` to report only.
#
# The job runs a11ylabel 0.1.0 from its GitHub release tarball with npx (the command is a11ylabel).
# Publishing the package to npm as @mcamdali/a11ylabel is planned; until then npx cannot find it
# by that name.
name: a11ylabel

on:
  pull_request:
    # Every file a11ylabel reads: the Xcode project, Info.plist and asset catalogs, Swift,
    # Objective-C, JavaScript, TypeScript and Dart sources at any depth, and the manifests and
    # config files.
    paths:
      - 'ios/**'
      - '**/*.xcodeproj/**'
      - '**/Info.plist'
      - '**/*.xcassets/**'
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.dart'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LABELS: larger-text,dark-interface,reduced-motion

jobs:
  check:
    runs-on: ubuntu-24.04
    # Ends the job if a run waits on something in the checked repository, instead of GitHub's
    # default limit of six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the claimed accessibility labels
        run: |
          status=0
          npx --yes --package=https://github.com/muhittincamdali/a11ylabel/releases/download/v0.1.0/a11ylabel-0.1.0.tgz \
            a11ylabel --labels "$LABELS" --format markdown --output a11ylabel.md || status=$?
          # Exit code 2 (bad arguments, or the project could not be read) can come without a report.
          if [ -f a11ylabel.md ]; then
            cat a11ylabel.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "a11ylabel exited with $status and wrote no report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11ylabel-report
          path: a11ylabel.md
          if-no-files-found: ignore
