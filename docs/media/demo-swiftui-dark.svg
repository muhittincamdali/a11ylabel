an class="t" style="animation-delay:1.93s">b</tspan><tspan class="t" style="animation-delay:1.98s">l</tspan><tspan class="t" style="animation-delay:2.02s">o</tspan><tspan class="t" style="animation-delay:2.06s">c</tspan><tspan class="t" style="animation-delay:2.11s">k</tspan><tspan class="t" style="animation-delay:2.15s">e</tspan><tspan class="t" style="animation-delay:2.20s">d</tspan><tspan class="t" style="animation-delay:2.25s"> </tspan><tspan class="t" style="animation-delay:2.29s">-</tspan><tspan class="t" style="animation-delay:2.33s">-</tspan><tspan class="t" style="animation-delay:2.38s">l</tspan><tspan class="t" style="animation-delay:2.42s">a</tspan><tspan class="t" style="animation-delay:2.47s">b</tspan><tspan class="t" style="animation-delay:2.51s">e</tspan><tspan class="t" style="animation-delay:2.56s">l</tspan><tspan class="t" style="animation-delay:2.60s">s</tspan><tspan class="t" style="animation-delay:2.65s"> </tspan><tspan class="t" style="animation-delay:2.69s">l</tspan><tspan class="t" style="animation-delay:2.74s">a</tspan><tspan class="t" style="animation-delay:2.78s">r</tspan><tspan class="t" style="animation-delay:2.83s">g</tspan><tspan class="t" style="animation-delay:2.88s">e</tspan><tspan class="t" style="animation-delay:2.92s">r</tspan><tspan class="t" style="animation-delay:2.96s">-</tspan><tspan class="t" style="animation-delay:3.01s">t</tspan><tspan class="t" style="animation-delay:3.05s">e</tspan><tspan class="t" style="animation-delay:3.10s">x</tspan><tspan class="t" style="animation-delay:3.15s">t</tspan><tspan class="t" style="animation-delay:3.19s">,</tspan><tspan class="t" style="animation-delay:3.23s">d</tspan><tspan class="t" style="animation-delay:3.28s">a</tspan><tspan class="t" style="animation-delay:3.32s">r</tspan><tspan class="t" style="animation-delay:3.37s">k</tspan><tspan class="t" style="animation-delay:3.41s">-</tspan><tspan class="t" style="animation-delay:3.46s">i</tspan><tspan class="t" style="animation-delay:3.50s">n</tspan><tspan class="t" style="animation-delay:3.55s">t</tspan><tspan class="t" style="animation-delay:3.59s">e</tspan><tspan class="t" style="animation-delay:3.64s">r</tspan><tspan class="t" style="animation-delay:3.68s">f</tspan><tspan class="t" style="animation-delay:3.73s">a</tspan><tspan class="t" style="animation-delay:3.77s">c</tspan><tspan class="t" style="animation-delay:3.82s">e</tspan></tspan></text>
<text class="t" x="20" y="105" style="animation-delay:4.37s"><tspan fill="#8FA3BC">a11ylabel 0.0.0 · rules nutrition-labels@2026.10.28</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:4.40s"></text>
<text class="t" x="20" y="143" style="animation-delay:4.44s"><tspan fill="#FFFFFF" font-weight="700">Pantry</tspan><tspan fill="#D0E2F7"> · native iOS · fixtures/native-swiftui-blocked</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:4.47s"><tspan fill="#8FA3BC">target Pantry · UIUserInterfaceStyle Light · iOS 18.0</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:4.50s"></text>
<text class="t" x="20" y="200" style="animation-delay:4.54s"><tspan fill="#FFFFFF" font-weight="700">Label                              Status            Findings</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:4.58s"><tspan fill="#D0E2F7">Larger Text                        </tspan><tspan fill="#FFFFFF">BLOCKED</tspan><tspan fill="#D0E2F7">           1 error, 3 warnings</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:4.61s"><tspan fill="#D0E2F7">Dark Interface                     </tspan><tspan fill="#FFFFFF">BLOCKED</tspan><tspan fill="#D0E2F7">           1 error, 1 info</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:4.65s"></text>
<text class="t" x="20" y="276" style="animation-delay:4.68s"><tspan fill="#FFFFFF" font-weight="700">2 labels blocked by the code (Larger Text, Dark Interface)</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:4.71s"><tspan fill="#5AC8FA">Already in the code: Larger Text: Uses Dynamic Type text styles (Pantry/RecipeView.swift)</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:4.75s"></text>
<text class="t" x="20" y="333" style="animation-delay:4.79s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y101 Text size locked for the whole app · Larger Text</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:4.82s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Pantry/PantryApp.swift:9</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:4.86s"><tspan fill="#D0E2F7">         .dynamicTypeSize(...DynamicTypeSize.xLarge) on the app's scene: no text grows past xLarge,</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:4.89s"><tspan fill="#D0E2F7">         below 200%.</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:4.93s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [A] Remove the Dynamic Type limit from the scene</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:4.96s"></text>
<text class="t" x="20" y="447" style="animation-delay:5.00s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y201 Light appearance forced for the whole app · Dark Interface</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:5.03s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Pantry.xcodeproj/project.pbxproj:194</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:5.07s"><tspan fill="#D0E2F7">         Pantry: INFOPLIST_KEY_UIUserInterfaceStyle is Light: the app ignores Dark Mode and nothing</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:5.10s"><tspan fill="#D0E2F7">         in the code turns it dark.</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:5.13s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [B] Remove the build setting that forces light</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:5.17s"></text>
<text class="t" x="20" y="561" style="animation-delay:5.21s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y104 Fixed font size · Larger Text</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:5.24s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Pantry/PantryListView.swift:25</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:5.28s"><tspan fill="#D0E2F7">         .system(size:) is a fixed point size: Dynamic Type does not scale it.</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:5.31s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [C] Use a text style, or a size relative to one</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:5.35s"></text>
<text class="t" x="20" y="656" style="animation-delay:5.38s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y104 Fixed font size · Larger Text</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:5.42s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Pantry/PantryListView.swift:28</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:5.45s"><tspan fill="#D0E2F7">         .system(size:) is a fixed point size: Dynamic Type does not scale it.</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:5.49s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [C] Use a text style, or a size relative to one</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:5.52s"></text>
<text class="t" x="20" y="751" style="animation-delay:5.56s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y104 Fixed font size · Larger Text</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:5.59s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Pantry/RecipeView.swift:15</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:5.63s"><tspan fill="#D0E2F7">         Font.custom(_:fixedSize:) keeps its size whatever the system text size is.</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:5.66s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [C] Use a text style, or a size relative to one</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:5.70s"></text>
<text class="t" x="20" y="846" style="animation-delay:5.73s"><tspan fill="#64D2FF" font-weight="700">INFO     </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y205 Asset colours without a dark variant · Dark Interface</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:5.77s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Pantry/Assets.xcassets/Brand.colorset/Contents.json</tspan></text>
<text class="t" x="20" y="884" style="animation-delay:5.80s"><tspan fill="#D0E2F7">         3 of 3 asset colours have no dark variant: Brand, Card, Muted.</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:5.84s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [D] Add a dark value to each colour</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:5.87s"></text>
<text class="t" x="20" y="941" style="animation-delay:5.91s"><tspan fill="#FFFFFF" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:5.94s"></text>
<text class="t" x="20" y="979" style="animation-delay:5.98s"><tspan fill="#FFFFFF" font-weight="700">[A]      </tspan><tspan fill="#FFFFFF" font-weight="700">Remove the Dynamic Type limit from the scene</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:6.01s"><tspan fill="#D0E2F7">         1. Remove .dynamicTypeSize(…) from the WindowGroup content, or raise its upper bound to</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:6.04s"><tspan fill="#D0E2F7">            .accessibility3 or above (AX3 is the first size above 200% for body text).</tspan></text>
<text class="t" x="20" y="1036" style="animation-delay:6.08s"><tspan fill="#D0E2F7">         2. Put a limit only on the views that cannot grow, such as a tab bar, and give them</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:6.12s"><tspan fill="#D0E2F7">            .accessibilityShowsLargeContentViewer().</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:6.15s"><tspan fill="#D0E2F7">         3. Preview the screens with .dynamicTypeSize(.accessibility5).</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:6.19s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/larger-text.md#swiftui</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:6.22s"></text>
<text class="t" x="20" y="1131" style="animation-delay:6.26s"><tspan fill="#FFFFFF" font-weight="700">[B]      </tspan><tspan fill="#FFFFFF" font-weight="700">Remove the build setting that forces light</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:6.29s"><tspan fill="#D0E2F7">         1. Delete INFOPLIST_KEY_UIUserInterfaceStyle (Build Settings &gt; Info.plist Values &gt; User</tspan></text>
<text class="t" x="20" y="1169" style="animation-delay:6.33s"><tspan fill="#D0E2F7">            Interface Style), or set it to Automatic.</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:6.36s"><tspan fill="#D0E2F7">         2. Give every custom colour a dark variant in the asset catalog, then use the common tasks</tspan></text>
<text class="t" x="20" y="1207" style="animation-delay:6.40s"><tspan fill="#D0E2F7">            in Dark Mode.</tspan></text>
<text class="t" x="20" y="1226" style="animation-delay:6.43s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/dark-interface.md#info-plist-and-build-settings</tspan></text>
<text class="t" x="20" y="1245" style="animation-delay:6.46s"></text>
<text class="t" x="20" y="1264" style="animation-delay:6.50s"><tspan fill="#FFFFFF" font-weight="700">[C]      </tspan><tspan fill="#FFFFFF" font-weight="700">Use a text style, or a size relative to one</tspan></text>
<text class="t" x="20" y="1283" style="animation-delay:6.54s"><tspan fill="#D0E2F7">         1. Replace .system(size: 17) with a text style such as .body, .headline or .title.</tspan></text>
<text class="t" x="20" y="1302" style="animation-delay:6.57s"><tspan fill="#D0E2F7">         2. For a custom size or font, use .system(size: 17, …) only for decoration; for text, use</tspan></text>
<text class="t" x="20" y="1321" style="animation-delay:6.61s"><tspan fill="#D0E2F7">            Font.custom("Name", size: 17, relativeTo: .body) or a @ScaledMetric size.</tspan></text>
<text class="t" x="20" y="1340" style="animation-delay:6.64s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/larger-text.md#swiftui</tspan></text>
<text class="t" x="20" y="1359" style="animation-delay:6.68s"></text>
<text class="t" x="20" y="1378" style="animation-delay:6.71s"><tspan fill="#FFFFFF" font-weight="700">[D]      </tspan><tspan fill="#FFFFFF" font-weight="700">Add a dark value to each colour</tspan></text>
<text class="t" x="20" y="1397" style="animation-delay:6.75s"><tspan fill="#D0E2F7">         1. Select the colour set in Xcode, set Appearances to "Any, Dark" in the Attributes</tspan></text>
<text class="t" x="20" y="1416" style="animation-delay:6.78s"><tspan fill="#D0E2F7">            inspector and fill the Dark well.</tspan></text>
<text class="t" x="20" y="1435" style="animation-delay:6.82s"><tspan fill="#D0E2F7">         2. Keep a single value only for colours that read well on both light and dark backgrounds.</tspan></text>
<text class="t" x="20" y="1454" style="animation-delay:6.85s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/dark-interface.md#asset-catalog-colours</tspan></text>
<text class="t" x="20" y="1473" style="animation-delay:6.89s"></text>
<text class="t" x="20" y="1492" style="animation-delay:6.92s"><tspan fill="#FFFFFF" font-weight="700">2 errors, 3 warnings, 1 info</tspan></text>
<text class="t" x="20" y="1511" style="animation-delay:6.96s"><tspan fill="#8FA3BC">a11ylabel reads code. Before claiming a label, Apple asks that people can complete every common task</tspan></text>
<text class="t" x="20" y="1530" style="animation-delay:6.99s"><tspan fill="#8FA3BC">of the app with the feature on.</tspan></text>
<text class="t" x="20" y="1549" style="animation-delay:7.03s"><tspan fill="#8FA3BC">Criteria: https://developer.apple.com/help/app-store-connect/manage-app-accessibility/overview-of-accessibility-nutrition-labels</tspan></text>
<text class="t" x="20" y="1568" style="animation-delay:7.26s"><tspan fill="#0A84FF" font-weight="700">$ </tspan></text>
<rect class="caret" x="35.66" y="1556" width="7.83" height="16" fill="#0A84FF" style="animation-delay:7.26s"/>
