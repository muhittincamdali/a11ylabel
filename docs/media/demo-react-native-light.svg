<text class="t" x="20" y="105" style="animation-delay:4.54s"><tspan fill="#5A6B80">a11ylabel 0.0.0 · rules nutrition-labels@2026.10.28</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:4.58s"></text>
<text class="t" x="20" y="143" style="animation-delay:4.62s"><tspan fill="#00285C" font-weight="700">HelloWorld</tspan><tspan fill="#0B1F33"> · React Native · fixtures/rn-088-courier</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:4.65s"><tspan fill="#5A6B80">target HelloWorld · iOS 15.1 (ios/HelloWorld/Info.plist)</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:4.68s"><tspan fill="#5A6B80">react-native 0.88.1 (declared)</tspan></text>
<text class="t" x="20" y="200" style="animation-delay:4.72s"></text>
<text class="t" x="20" y="219" style="animation-delay:4.75s"><tspan fill="#00285C" font-weight="700">Label                              Status            Findings</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:4.79s"><tspan fill="#0B1F33">VoiceOver                          </tspan><tspan fill="#0058D4">review</tspan><tspan fill="#0B1F33">            1 warning, 1 info</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:4.83s"><tspan fill="#0B1F33">Voice Control                      </tspan><tspan fill="#0058D4">review</tspan><tspan fill="#0B1F33">            1 warning</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:4.86s"><tspan fill="#0B1F33">Dark Interface                     </tspan><tspan fill="#0058D4">review</tspan><tspan fill="#0B1F33">            1 warning</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:4.89s"></text>
<text class="t" x="20" y="314" style="animation-delay:4.93s"><tspan fill="#0058D4" font-weight="700">No label blocked; 3 labels to review (VoiceOver, Voice Control, Dark Interface)</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:4.96s"><tspan fill="#0071E3">Already in the code: VoiceOver: Sets accessibility labels (App.tsx)</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:5.00s"></text>
<text class="t" x="20" y="371" style="animation-delay:5.04s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">A11Y203 Light colour scheme set in code · Dark Interface</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:5.07s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">App.tsx:22</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:5.11s"><tspan fill="#0B1F33">         Appearance.setColorScheme('light') keeps the whole app light, whatever the system</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:5.14s"><tspan fill="#0B1F33">         appearance is.</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:5.17s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [A] Stop forcing the light scheme</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:5.21s"></text>
<text class="t" x="20" y="485" style="animation-delay:5.25s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">A11Y401 Icon-only button without an accessibility label · VoiceOver, Voice Control</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:5.28s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">App.tsx:52</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:5.31s"><tspan fill="#0B1F33">         A Pressable that shows only an icon or image, without accessibilityLabel.</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:5.35s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [B] Name the button</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:5.38s"></text>
<text class="t" x="20" y="580" style="animation-delay:5.42s"><tspan fill="#0071E3" font-weight="700">INFO     </tspan><tspan fill="#00285C" font-weight="700">A11Y402 Accessibility label names the control type · VoiceOver</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:5.46s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">App.tsx:66</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:5.49s"><tspan fill="#0B1F33">         The label "Call courier button" ends with "button", which VoiceOver already says from the</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:5.53s"><tspan fill="#0B1F33">         element's traits.</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:5.56s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [C] Drop the control type from the label</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:5.59s"></text>
<text class="t" x="20" y="694" style="animation-delay:5.63s"><tspan fill="#00285C" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:5.67s"></text>
<text class="t" x="20" y="732" style="animation-delay:5.70s"><tspan fill="#00285C" font-weight="700">[A]      </tspan><tspan fill="#00285C" font-weight="700">Stop forcing the light scheme</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:5.74s"><tspan fill="#0B1F33">         1. Remove Appearance.setColorScheme('light'), or call it only with the person's own choice.</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:5.77s"><tspan fill="#0B1F33">         2. Read useColorScheme() and pick colours for both schemes.</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:5.80s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/dark-interface.md#react-native</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:5.84s"></text>
<text class="t" x="20" y="827" style="animation-delay:5.88s"><tspan fill="#00285C" font-weight="700">[B]      </tspan><tspan fill="#00285C" font-weight="700">Name the button</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:5.91s"><tspan fill="#0B1F33">         1. Add accessibilityLabel="Close" (or aria-label) and accessibilityRole="button" to the</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:5.95s"><tspan fill="#0B1F33">            Pressable or Touchable.</tspan></text>
<text class="t" x="20" y="884" style="animation-delay:5.98s"><tspan fill="#0B1F33">         2. For react-native-paper's IconButton, pass accessibilityLabel.</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:6.02s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/voiceover.md#react-native-and-expo</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:6.05s"></text>
<text class="t" x="20" y="941" style="animation-delay:6.08s"><tspan fill="#00285C" font-weight="700">[C]      </tspan><tspan fill="#00285C" font-weight="700">Drop the control type from the label</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:6.12s"><tspan fill="#0B1F33">         1. Shorten the label to the action ("Close") and set accessibilityRole="button" (or</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:6.16s"><tspan fill="#0B1F33">            role="button").</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:6.19s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/voiceover.md#react-native-and-expo</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:6.22s"></text>
<text class="t" x="20" y="1036" style="animation-delay:6.26s"><tspan fill="#00285C" font-weight="700">0 errors, 2 warnings, 1 info</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:6.29s"><tspan fill="#5A6B80">a11ylabel reads code. Before claiming a label, Apple asks that people can complete every common task</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:6.33s"><tspan fill="#5A6B80">of the app with the feature on.</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:6.37s"><tspan fill="#5A6B80">Criteria: https://developer.apple.com/help/app-store-connect/manage-app-accessibility/overview-of-accessibility-nutrition-labels</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:6.60s"><tspan fill="#0071E3" font-weight="700">$ </tspan></text>
