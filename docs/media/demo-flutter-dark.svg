an class="t" style="animation-delay:1.93s">l</tspan><tspan class="t" style="animation-delay:1.98s">a</tspan><tspan class="t" style="animation-delay:2.02s">b</tspan><tspan class="t" style="animation-delay:2.06s">e</tspan><tspan class="t" style="animation-delay:2.11s">l</tspan><tspan class="t" style="animation-delay:2.15s">s</tspan><tspan class="t" style="animation-delay:2.20s"> </tspan><tspan class="t" style="animation-delay:2.25s">l</tspan><tspan class="t" style="animation-delay:2.29s">a</tspan><tspan class="t" style="animation-delay:2.33s">r</tspan><tspan class="t" style="animation-delay:2.38s">g</tspan><tspan class="t" style="animation-delay:2.42s">e</tspan><tspan class="t" style="animation-delay:2.47s">r</tspan><tspan class="t" style="animation-delay:2.51s">-</tspan><tspan class="t" style="animation-delay:2.56s">t</tspan><tspan class="t" style="animation-delay:2.60s">e</tspan><tspan class="t" style="animation-delay:2.65s">x</tspan><tspan class="t" style="animation-delay:2.69s">t</tspan><tspan class="t" style="animation-delay:2.74s">,</tspan><tspan class="t" style="animation-delay:2.78s">d</tspan><tspan class="t" style="animation-delay:2.83s">a</tspan><tspan class="t" style="animation-delay:2.88s">r</tspan><tspan class="t" style="animation-delay:2.92s">k</tspan><tspan class="t" style="animation-delay:2.96s">-</tspan><tspan class="t" style="animation-delay:3.01s">i</tspan><tspan class="t" style="animation-delay:3.05s">n</tspan><tspan class="t" style="animation-delay:3.10s">t</tspan><tspan class="t" style="animation-delay:3.15s">e</tspan><tspan class="t" style="animation-delay:3.19s">r</tspan><tspan class="t" style="animation-delay:3.23s">f</tspan><tspan class="t" style="animation-delay:3.28s">a</tspan><tspan class="t" style="animation-delay:3.32s">c</tspan><tspan class="t" style="animation-delay:3.37s">e</tspan><tspan class="t" style="animation-delay:3.41s">,</tspan><tspan class="t" style="animation-delay:3.46s">r</tspan><tspan class="t" style="animation-delay:3.50s">e</tspan><tspan class="t" style="animation-delay:3.55s">d</tspan><tspan class="t" style="animation-delay:3.59s">u</tspan><tspan class="t" style="animation-delay:3.64s">c</tspan><tspan class="t" style="animation-delay:3.68s">e</tspan><tspan class="t" style="animation-delay:3.73s">d</tspan><tspan class="t" style="animation-delay:3.77s">-</tspan><tspan class="t" style="animation-delay:3.82s">m</tspan><tspan class="t" style="animation-delay:3.86s">o</tspan><tspan class="t" style="animation-delay:3.91s">t</tspan><tspan class="t" style="animation-delay:3.95s">i</tspan><tspan class="t" style="animation-delay:4.00s">o</tspan><tspan class="t" style="animation-delay:4.04s">n</tspan></tspan></text>
<text class="t" x="20" y="105" style="animation-delay:4.59s"><tspan fill="#8FA3BC">a11ylabel 0.0.0 · rules nutrition-labels@2026.10.28</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:4.63s"></text>
<text class="t" x="20" y="143" style="animation-delay:4.66s"><tspan fill="#FFFFFF" font-weight="700">tide</tspan><tspan fill="#D0E2F7"> · Flutter · fixtures/flutter-tide</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:4.70s"><tspan fill="#8FA3BC">target Runner · iOS 15.0 (ios/Runner/Info.plist)</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:4.73s"></text>
<text class="t" x="20" y="200" style="animation-delay:4.76s"><tspan fill="#FFFFFF" font-weight="700">Label                              Status            Findings</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:4.80s"><tspan fill="#D0E2F7">Larger Text                        </tspan><tspan fill="#FFFFFF">BLOCKED</tspan><tspan fill="#D0E2F7">           1 error, 1 warning</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:4.83s"><tspan fill="#D0E2F7">Dark Interface                     </tspan><tspan fill="#8CC4FF">review</tspan><tspan fill="#D0E2F7">            1 warning</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:4.87s"><tspan fill="#D0E2F7">Reduced Motion                     </tspan><tspan fill="#8CC4FF">review</tspan><tspan fill="#D0E2F7">            2 warnings</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:4.91s"></text>
<text class="t" x="20" y="295" style="animation-delay:4.94s"><tspan fill="#FFFFFF" font-weight="700">1 label blocked by the code (Larger Text); 2 to review</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:4.97s"></text>
<text class="t" x="20" y="333" style="animation-delay:5.01s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y101 Text size locked for the whole app · Larger Text</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:5.04s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">lib/main.dart:16</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:5.08s"><tspan fill="#D0E2F7">         maxScaleFactor 1.3 in the app's builder: all text stops at 130% of its size.</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:5.12s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [A] Stop overriding the text scaler for the whole app</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:5.15s"></text>
<text class="t" x="20" y="428" style="animation-delay:5.18s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y102 Text that does not scale · Larger Text</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:5.22s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">lib/main.dart:86</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:5.25s"><tspan fill="#D0E2F7">         TextScaler.noScaling: this text keeps its size when the system text size grows.</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:5.29s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [B] Let this text scale</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:5.33s"></text>
<text class="t" x="20" y="523" style="animation-delay:5.36s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y204 Flutter app without a dark theme · Dark Interface</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:5.39s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">lib/main.dart:10</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:5.43s"><tspan fill="#D0E2F7">         MaterialApp has no darkTheme, so it shows its light theme in Dark Mode too.</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:5.46s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [C] Add a dark theme</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:5.50s"></text>
<text class="t" x="20" y="618" style="animation-delay:5.54s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y301 Motion in an app that never reads Reduce Motion · Reduced Motion</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:5.57s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">lib/main.dart:50</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:5.61s"><tspan fill="#D0E2F7">         repeat(), an animation that never stops, and nothing in the app reads Reduce Motion.</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:5.64s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [D] Read Reduce Motion and calm the animation</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:5.67s"></text>
<text class="t" x="20" y="713" style="animation-delay:5.71s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">A11Y303 Flutter reads disableAnimations, which iOS Reduce Motion does not set · Reduced</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:5.75s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Motion</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:5.78s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">lib/main.dart:60</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:5.81s"><tspan fill="#D0E2F7">         The app reads disableAnimations but not accessibilityFeatures.reduceMotion, so an iPhone</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:5.85s"><tspan fill="#D0E2F7">         with Reduce Motion on still gets every animation.</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:5.88s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#FFFFFF" font-weight="700">Fix: [E] Also read the iOS setting</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:5.92s"></text>
<text class="t" x="20" y="846" style="animation-delay:5.96s"><tspan fill="#FFFFFF" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:5.99s"></text>
<text class="t" x="20" y="884" style="animation-delay:6.03s"><tspan fill="#FFFFFF" font-weight="700">[A]      </tspan><tspan fill="#FFFFFF" font-weight="700">Stop overriding the text scaler for the whole app</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:6.06s"><tspan fill="#D0E2F7">         1. Remove the MediaQuery, MediaQuery.withNoTextScaling or TextScaler.noScaling that wraps</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:6.09s"><tspan fill="#D0E2F7">            the app in MaterialApp.builder.</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:6.13s"><tspan fill="#D0E2F7">         2. If a limit is needed, use MediaQuery.withClampedTextScaling with maxScaleFactor 2.0 or</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:6.17s"><tspan fill="#D0E2F7">            more, or clamp only the widgets that cannot grow.</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:6.20s"><tspan fill="#D0E2F7">         3. Check the common tasks at the largest accessibility size on an iOS simulator.</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:6.24s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/larger-text.md#flutter</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:6.27s"></text>
<text class="t" x="20" y="1036" style="animation-delay:6.30s"><tspan fill="#FFFFFF" font-weight="700">[B]      </tspan><tspan fill="#FFFFFF" font-weight="700">Let this text scale</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:6.34s"><tspan fill="#D0E2F7">         1. Remove textScaler: TextScaler.noScaling (or linear(1.0), or textScaleFactor: 1.0) from</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:6.38s"><tspan fill="#D0E2F7">            this widget.</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:6.41s"><tspan fill="#D0E2F7">         2. If it cannot grow, clamp it with MediaQuery.withClampedTextScaling(maxScaleFactor: 2.0)</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:6.45s"><tspan fill="#D0E2F7">            rather than turning scaling off.</tspan></text>
<text class="t" x="20" y="1131" style="animation-delay:6.48s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/larger-text.md#flutter</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:6.52s"></text>
<text class="t" x="20" y="1169" style="animation-delay:6.55s"><tspan fill="#FFFFFF" font-weight="700">[C]      </tspan><tspan fill="#FFFFFF" font-weight="700">Add a dark theme</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:6.58s"><tspan fill="#D0E2F7">         1. Pass darkTheme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: …, brightness:</tspan></text>
<text class="t" x="20" y="1207" style="animation-delay:6.62s"><tspan fill="#D0E2F7">            Brightness.dark)) to MaterialApp.</tspan></text>
<text class="t" x="20" y="1226" style="animation-delay:6.66s"><tspan fill="#D0E2F7">         2. Leave themeMode at ThemeMode.system, and read colours from Theme.of(context).colorScheme</tspan></text>
<text class="t" x="20" y="1245" style="animation-delay:6.69s"><tspan fill="#D0E2F7">            instead of constants.</tspan></text>
<text class="t" x="20" y="1264" style="animation-delay:6.72s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/dark-interface.md#flutter</tspan></text>
<text class="t" x="20" y="1283" style="animation-delay:6.76s"></text>
<text class="t" x="20" y="1302" style="animation-delay:6.79s"><tspan fill="#FFFFFF" font-weight="700">[D]      </tspan><tspan fill="#FFFFFF" font-weight="700">Read Reduce Motion and calm the animation</tspan></text>
<text class="t" x="20" y="1321" style="animation-delay:6.83s"><tspan fill="#D0E2F7">         1. Read PlatformDispatcher.instance.accessibilityFeatures.reduceMotion (iOS) together with</tspan></text>
<text class="t" x="20" y="1340" style="animation-delay:6.87s"><tspan fill="#D0E2F7">            MediaQuery.disableAnimationsOf(context) (Android).</tspan></text>
<text class="t" x="20" y="1359" style="animation-delay:6.90s"><tspan fill="#D0E2F7">         2. When either is set, do not call repeat() or auto-play Lottie and carousels; jump to the</tspan></text>
<text class="t" x="20" y="1378" style="animation-delay:6.94s"><tspan fill="#D0E2F7">            end value instead.</tspan></text>
<text class="t" x="20" y="1397" style="animation-delay:6.97s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/reduced-motion.md#flutter</tspan></text>
<text class="t" x="20" y="1416" style="animation-delay:7.00s"></text>
<text class="t" x="20" y="1435" style="animation-delay:7.04s"><tspan fill="#FFFFFF" font-weight="700">[E]      </tspan><tspan fill="#FFFFFF" font-weight="700">Also read the iOS setting</tspan></text>
<text class="t" x="20" y="1454" style="animation-delay:7.08s"><tspan fill="#D0E2F7">         1. Combine both: MediaQuery.disableAnimationsOf(context) ||</tspan></text>
<text class="t" x="20" y="1473" style="animation-delay:7.11s"><tspan fill="#D0E2F7">            View.of(context).platformDispatcher.accessibilityFeatures.reduceMotion.</tspan></text>
<text class="t" x="20" y="1492" style="animation-delay:7.14s"><tspan fill="#D0E2F7">         2. Rebuild when the setting changes: listen to</tspan></text>
<text class="t" x="20" y="1511" style="animation-delay:7.18s"><tspan fill="#D0E2F7">            PlatformDispatcher.onAccessibilityFeaturesChanged or</tspan></text>
<text class="t" x="20" y="1530" style="animation-delay:7.21s"><tspan fill="#D0E2F7">            WidgetsBindingObserver.didChangeAccessibilityFeatures.</tspan></text>
<text class="t" x="20" y="1549" style="animation-delay:7.25s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/a11ylabel/blob/main/docs/guides/reduced-motion.md#flutter</tspan></text>
<text class="t" x="20" y="1568" style="animation-delay:7.29s"></text>
<text class="t" x="20" y="1587" style="animation-delay:7.32s"><tspan fill="#FFFFFF" font-weight="700">1 error, 4 warnings, 0 info</tspan></text>
<text class="t" x="20" y="1606" style="animation-delay:7.36s"><tspan fill="#8FA3BC">a11ylabel reads code. Before claiming a label, Apple asks that people can complete every common task</tspan></text>
<text class="t" x="20" y="1625" style="animation-delay:7.39s"><tspan fill="#8FA3BC">of the app with the feature on.</tspan></text>
<text class="t" x="20" y="1644" style="animation-delay:7.43s"><tspan fill="#8FA3BC">Criteria: https://developer.apple.com/help/app-store-connect/manage-app-accessibility/overview-of-accessibility-nutrition-labels</tspan></text>
<text class="t" x="20" y="1663" style="animation-delay:7.66s"><tspan fill="#0A84FF" font-weight="700">$ </tspan></text>
<rect class="caret" x="35.66" y="1651" width="7.83" height="16" fill="#0A84FF" style="animation-delay:7.66s"/>
